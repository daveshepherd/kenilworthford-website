<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="<%= require('./images/favicon.png') %>">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="<%= htmlWebpackPlugin.files.publicPath %>assets/icon-192.png">
  <meta name="theme-color" content="#1f3c88">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <meta name="Description" content="Flood information for the Kenilworth ford">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><%= htmlWebpackPlugin.options.title %></title>
  <script src="config.js" type="text/javascript"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P6NXG2Y71B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-P6NXG2Y71B');
  </script>
</head>
<body>

  <header class="top-nav">
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="." class="active" aria-current="page">home</a></li>
        <li><a href="chart.html">chart</a></li>
        <li><a href="about.html">about</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1><%= htmlWebpackPlugin.options.title %></h1>

    <div class="site-status" id="siteStatus">
    </div>

    <div class="status-wrapper">
      <!-- Change status class to: status-green, status-orange, or status-red -->
      <output id="statusPanel" class="status-box status-grey" aria-live="polite">
        <span id="fordStatus" class="status-text">Loading...</span>
        <span id="statusIcon" class="status-icon"></span>
      </output>
      <p id="lastUpdated" class="timestamp"></p>
    </div>

    <div class="twitter-container">
      <p>Get notified when the ford floods: <a href="https://twitter.com/kenilworthford?ref_src=twsrc%5Etfw" class="twitter-follow-button" data-show-count="false">Follow @kenilworthford</a></p>
    </div>
  </main>
</body>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</html>
